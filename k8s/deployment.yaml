# Kubernetes Deployment Manifests for ARIA Project

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aria-redis
spec:
  selector:
    matchLabels:
      app: aria-redis
  template:
    metadata:
      labels:
        app: aria-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  ports:
  - port: 6379
  selector:
    app: aria-redis

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aria-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aria-api
  template:
    metadata:
      labels:
        app: aria-api
    spec:
      containers:
      - name: api
        image: YOUR_REGISTRY/aria-api:optimized
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: aria-secrets

---
apiVersion: v1
kind: Service
metadata:
  name: aria-api
spec:
  type: LoadBalancer
  ports:
  - port: 8000
  selector:
    app: aria-api

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aria-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aria-worker
  template:
    metadata:
      labels:
        app: aria-worker
    spec:
      containers:
      - name: worker
        image: YOUR_REGISTRY/aria-worker:optimized
        envFrom:
        - secretRef:
            name: aria-secrets

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aria-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aria-frontend
  template:
    metadata:
      labels:
        app: aria-frontend
    spec:
      containers:
      - name: frontend
        image: YOUR_REGISTRY/aria-frontend:optimized
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: aria-frontend
spec:
  type: LoadBalancer
  ports:
  - port: 80
  selector:
    app: aria-frontend
